[workspace.package]
edition = "2024"
authors = ["F.X.P. <litran39@hotmail.com>"]
license = "MIT"
version = "0.1.0-alpha"

[package]
name = "ranim-midi-visualizer"
description = "A MIDI visualizer that renders MIDI files into scrolling videos. Powered by Rust and Ranim."
edition.workspace = true
authors.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
ranim = { workspace = true, features = ["render", "preview"] }
anyhow = { workspace = true }
itertools = { workspace = true }
tracing = { workspace = true }
tracing-indicatif = { workspace = true }
tracing-subscriber = { workspace = true }
uncased = "0.9.10"
color = "0.3.2"
phf = { workspace = true }
eframe = { workspace = true }
ranim-midi-visualizer_lib = { workspace = true }
waveform-utils = { workspace = true }
typed_floats = { workspace = true }
# ranim-midi-visualizer_ui = { path = "crates/ranim-midi-visualizer_ui" }

[dependencies.clap]
version = "4.5.57"
features = ["cargo", "color"]

[workspace]
members = [
    "crates/ranim_music",
    "crates/ranim-midi-visualizer_lib",
    # "crates/ranim-midi-visualizer_ui",
    "crates/music-utils",
    "crates/ranim-midi-visualizer_math",
    "crates/waveform-utils",
    "crates/simple-interval-tree",
]

[workspace.dependencies]
eframe = "0.34.1"
egui_dock = "0.19.1"
egui-phosphor = "0.12.0"
egui_tiles = "0.15.0"

gpui = { git = "https://github.com/zed-industries/zed.git" }

tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

num-integer = "0.1.46"
num-complex = "0.4.6"

ranim_music = { path = "crates/ranim_music" }
ranim-midi-visualizer_math = { path = "crates/ranim-midi-visualizer_math" }
music-utils = { path = "crates/music-utils" }
waveform-utils = { path = "crates/waveform-utils" }
simple-interval-tree = { path = "crates/simple-interval-tree" }

ordered-float = "5.1.0"
typed_floats = "1.0.7"

itertools = "0.14.0"
int-enum = "1.2.0"
rfd = "0.17.2"
glam = "0.32.1"
async-channel = "2.5.0"
phf = { version = "0.13.1", features = ["macros", "uncased"] }
enum-ordinalize = "4.3.2"
serde = { version = "1.0.228", features = ["serde_derive"] }
toml = "1.1.2"
cpal = "0.17.3"
midly = "0.5.3"
rustysynth = { git = "https://github.com/vanleefxp/rustysynth_fork.git" }
derivative = "2.2.0"
smallvec = "1.15.1"
paste = "1.0.15"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = "2.0.118"
anyhow = "1.0.101"
thiserror = "2.0.18"
tracing-test = "0.2.6"
rand = "0.10.1"
assert_float_eq = "1.2.0"
flagset = "0.4.7"
taffy = "0.11.0"

[workspace.dependencies.ranim]
git = "https://github.com/AzurIce/ranim.git"
# git = "https://github.com/vanleefxp/ranim_fork.git"
features = ["render"]

[workspace.dependencies.ranim-macros]
git = "https://github.com/AzurIce/ranim.git"
# git = "https://github.com/vanleefxp/ranim_fork.git"

[workspace.dependencies.ranim-midi-visualizer_lib]
path = "crates/ranim-midi-visualizer_lib"
features = ["serde"]

[workspace.dependencies.derive_more]
version = "2.1.1"
features = [
    "deref",
    "deref_mut",
    "index",
    "index_mut",
    "into_iterator",
    "from",
    "into",
    "display",
]
