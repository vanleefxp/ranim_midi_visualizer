[workspace.package]
edition = "2024"
authors = ["F.X.P. <litran39@hotmail.com>"]
license = "MIT"
version = "0.1.0-alpha"

[package]
name = "ranim-midi-visualizer"
description = "A MIDI visualizer that renders MIDI files into scrolling videos. Powered by Rust and Ranim."
edition.workspace = true
authors.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
ranim = { workspace = true }
anyhow = { workspace = true }
itertools = { workspace = true }
tracing = { workspace = true }
tracing-indicatif = { workspace = true }
tracing-subscriber = { workspace = true }
phf = { workspace = true }
uncased = { workspace = true }
color = { workspace = true }
ranim-midi-visualizer_lib = { workspace = true }
waveform-utils = { workspace = true }
typed_floats = { workspace = true }

[dependencies.clap]
version = "4.5.57"
features = ["cargo", "color"]

[features]
default = ["preview"]
preview = []

[workspace]
members = [
    "crates/ranim_music",
    "crates/ranim-midi-visualizer_lib",
    "crates/music-utils",
    "crates/ranim-midi-visualizer_math",
    "crates/waveform-utils",
    "crates/simple-interval-tree",
]

[workspace.dependencies]
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

num-integer = "0.1.46"
num-complex = "0.4.6"

ranim_music = { path = "crates/ranim_music" }
ranim-midi-visualizer_math = { path = "crates/ranim-midi-visualizer_math" }
music-utils = { path = "crates/music-utils" }
waveform-utils = { path = "crates/waveform-utils" }
simple-interval-tree = { path = "crates/simple-interval-tree" }

ordered-float = "5.1.0"
typed_floats = "1.0.7"

itertools = "0.14.0"
int-enum = "1.2.0"
glam = "0.33.2"
async-channel = "2.5.0"
phf = { version = "0.13.1", features = ["macros", "uncased"] }
enum-ordinalize = "4.3.2"
serde = { version = "1.0.228", features = ["serde_derive"] }
toml = "1.1.2"
cpal = "0.17.3"
midly = "0.5.3"
derivative = "2.2.0"
smallvec = "1.15.1"
paste = "1.0.15"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = "2.0.118"
anyhow = "1.0.101"
thiserror = "2.0.18"
tracing-test = "0.2.6"
rand = "0.10.1"
assert_float_eq = "1.2.0"
flagset = "0.4.7"
schemars = "1.2.1"
uncased = "0.9.10"
color = "0.3.2"
jiff = "0.2.34"
indexmap = "2.14.0"
rust-i18n = "4.2.1"
stacker = "0.1.25"

[workspace.dependencies.ranim]
git = "https://github.com/AzurIce/ranim.git"
# git = "https://github.com/vanleefxp/ranim_fork.git"
rev = "3cb43c0d5dc70e901060f431540c67e60c1ba093"
features = ["preview", "render", "typst"]

[workspace.dependencies.ranim-macros]
git = "https://github.com/AzurIce/ranim.git"
# git = "https://github.com/vanleefxp/ranim_fork.git"
rev = "3cb43c0d5dc70e901060f431540c67e60c1ba093"

[workspace.dependencies.ranim-midi-visualizer_lib]
path = "crates/ranim-midi-visualizer_lib"
features = ["serde"]

[workspace.dependencies.derive_more]
version = "2.1.1"
features = ["full"]

[patch.crates-io]
eframe = { git = "https://github.com/emilk/egui", rev = "f2de65f636cdc7bbf662b4a5482f1385ce2a0bb9" }
egui = { git = "https://github.com/emilk/egui", rev = "f2de65f636cdc7bbf662b4a5482f1385ce2a0bb9" }
egui-phosphor = { git = "https://github.com/amPerl/egui-phosphor", rev = "d392183fe3766d49a78e4fce249e73777985119a" }
# proc-macro-error2 = { git = "https://github.com/gamma0987/proc-macro-error3.git", package = "proc-macro-error3" }
